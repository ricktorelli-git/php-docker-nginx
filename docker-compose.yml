name: php-docker
services:
  php_fpm:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    restart: always
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
      - ~/.composer:/root/.composer # Montar o volume do Composer
    networks:
      - myapp
    environment:
      MYSQL_HOST: ${DB_HOST}

  nginx:
    build:
      context: docker/nginx
      dockerfile: Dockerfile
    restart: always
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "${APP_PORT}:80"
    networks:
      - myapp
    depends_on:
      - php_fpm

  mysql:
    build:
        context: ./docker/mysql
        dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT}:3306"
    networks:
      - myapp

  phpmyadmin:
    build:
      context: ./docker/phpmyadmin
      dockerfile: Dockerfile

    restart: always
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_PORT: ${DB_PORT}
    ports:
      - "${PHPMYADMIN_PORT}:80"
    networks:
      - myapp
    depends_on:
      - mysql

  redis:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./docker/redis/data:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - myapp
    depends_on:
      - php_fpm
      - mysql

networks:
  myapp:
    driver: bridge
